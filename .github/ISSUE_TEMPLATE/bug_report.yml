name: Bug report
description: Report a reproducible simulator, replay, or interface problem.
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the scenario, policy, browser, and expected vs actual result. Remove private data from traces.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Minimal evidence
      description: A small redacted trace or screenshot helps us reproduce the issue.
